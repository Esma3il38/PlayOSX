name: Build PlayOSX

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build (NSIS installer + zip)
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload unsigned artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: PlayOSX-unsigned
          path: |
            dist/PlayOSX-Setup-*.exe
            dist/PlayOSX-*-win-x64.zip
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

      # Runs only after SignPath approval, once you add the repository
      # variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed artifacts
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: PlayOSX-signed
          path: signed/
          if-no-files-found: error
